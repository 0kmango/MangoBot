name: Calidad

# Mango Bot ya traía un buen conjunto de comprobaciones escritas a mano
# (ruff, el guardián de secretos y la prueba de humo) pero nada las ejecutaba
# automáticamente antes de un push. Este workflow las corre en cada cambio.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estatico:
    name: Lint y guardián de secretos
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Analizar el código con ruff
        run: ruff check .

      - name: Comprobar que no se subieron claves al repositorio
        run: python tests/check_secrets.py

  humo:
    name: Prueba de humo (cogs y comandos)
    runs-on: ubuntu-latest
    needs: estatico

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias del bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar la prueba de humo
        run: python tests/smoke_test.py
